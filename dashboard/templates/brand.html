{% extends "base.html" %}{% block body %}
<h1>{{ brand.name }} <span class="muted">— series-wise</span></h1>
<div class="grid">
{% for s in series %}
<a class="card" href="/series/{{ s.id }}"><b style="font-size:16px">{{ s.name }}</b>
<div class="muted">{{ s.phones }} phones</div>
<div class="rowbtns" style="margin-top:8px"><span class="btn ghost" style="font-size:12px">Open →</span></div></a>
{% endfor %}
</div>
{% endblock %}
